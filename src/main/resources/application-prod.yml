# Production. All values come from environment variables; the app fails to start if any is missing.
spring:
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.yoedi.epos: INFO

epos:
  cors:
    # Comma-separated list of allowed frontend origins, e.g. https://kasir.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
